name: Push function type check

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/functions/notify-overdue-loads/**"
      - "supabase/migrations/**"
      - ".github/workflows/push-function-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check the Edge Function
        run: deno check --node-modules-dir=auto supabase/functions/notify-overdue-loads/index.ts
